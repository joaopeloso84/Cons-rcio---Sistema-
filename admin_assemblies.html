{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5>Assembleias</h5>
  <a class="btn btn-primary btn-sm" href="/admin/assemblies/new">Nova assembleia</a>
</div>
<table class="table table-sm table-striped bg-white">
  <thead><tr><th>ID</th><th>Grupo</th><th>Título</th><th>Status</th><th>Janela</th><th></th></tr></thead>
  <tbody>
  {% for a in assemblies %}
    <tr>
      <td>{{ a.id }}</td>
      <td>{{ a.group.name }}</td>
      <td>{{ a.title }}</td>
      <td>{{ a.status }}</td>
      <td>{{ a.opens_at }} → {{ a.closes_at }}</td>
      <td><a class="btn btn-outline-secondary btn-sm" href="/admin/assemblies/{{ a.id }}">Abrir</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

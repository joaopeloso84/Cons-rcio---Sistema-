<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{{ title or "Consórcio MVP" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Consórcio MVP</a>
    <div class="d-flex gap-2">
      {% if user %}
        <span class="navbar-text text-white-50 small">Olá, {{ user.name }} ({{ user.role }})</span>
        <a class="btn btn-outline-light btn-sm" href="/logout">Sair</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container my-4">
  {% if flash %}
    <div class="alert alert-info">{{ flash }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>

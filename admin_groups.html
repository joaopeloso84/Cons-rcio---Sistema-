{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5>Grupos</h5>
  <a class="btn btn-primary btn-sm" href="/admin/groups/new">Novo grupo</a>
</div>
<table class="table table-sm table-striped bg-white">
  <thead><tr><th>ID</th><th>Nome</th><th>Segmento</th><th>Cotas</th><th>Crédito</th></tr></thead>
  <tbody>
  {% for g in groups %}
    <tr>
      <td>{{ g.id }}</td>
      <td>{{ g.name }}</td>
      <td>{{ g.segment }}</td>
      <td>{{ g.total_quotas }}</td>
      <td>R$ {{ "%.2f"|format(g.credit_value) }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

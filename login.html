{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">Entrar</h5>
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">CPF (cliente) ou e-mail (admin)</label>
            <input class="form-control" name="identifier" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-muted mt-3 small">
          Primeiro acesso: abra <code>/seed</code> para criar o admin.
          Cliente é criado ao gerar contrato (login = CPF, senha padrão noteada no README).
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
